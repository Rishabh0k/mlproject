<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            padding:40px;
        }

        .container{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        h1{
            text-align:center;
        }

        input,select,button{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="POST">

        <select name="gender" required>
            <option disabled selected>Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <select name="race_ethnicity" required>
            <option disabled selected>Race</option>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
        </select>

        <select name="parental_level_of_education" required>
            <option disabled selected>Parent Education</option>
            <option value="bachelor's degree">Bachelor</option>
            <option value="master's degree">Master</option>
            <option value="high school">High School</option>
        </select>

        <select name="lunch" required>
            <option disabled selected>Lunch Type</option>
            <option value="standard">Standard</option>
            <option value="free/reduced">Free/Reduced</option>
        </select>

        <select name="test_preparation_course" required>
            <option disabled selected>Test Course</option>
            <option value="completed">Completed</option>
            <option value="none">None</option>
        </select>

        <input type="number" name="reading_score"
               placeholder="Reading Score" required>

        <input type="number" name="writing_score"
               placeholder="Writing Score" required>

        <button type="submit">
            Predict Maths Score
        </button>

    </form>

    <h2>
        THE prediction is {{results}}
    </h2>

</div>

</body>
</html>
